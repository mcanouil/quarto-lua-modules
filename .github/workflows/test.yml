name: Test

# CITATION.cff is here so that the release bump pull request, which touches
# only CITATION.cff and CHANGELOG.md, still produces a check run. The tests do
# not read the file. Auto-merge in release.yml waits for checks, and its guard
# aborts a release when the pull request is blocked with none, so removing this
# path would break every release the day `main` requires a status check.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "modules/**"
      - "tests/**"
      - "CITATION.cff"
      - ".github/workflows/test.yml"
  push:
    branches: [main]
    paths:
      - "modules/**"
      - "tests/**"
      - "CITATION.cff"
      - ".github/workflows/test.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # A draft is skipped, matching the convention across the extension
    # repositories, so a work in progress does not spend runner minutes.
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The modules run inside Quarto's Lua and several call `pandoc.*`, so the
      # tests need the Quarto CLI rather than a standalone Lua interpreter.
      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # The suite loads and executes every module it finds on disk, which
      # subsumes a parse check, so there is no separate one.
      - name: Run the tests
        run: quarto pandoc lua tests/run.lua
