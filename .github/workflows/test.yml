name: Test

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "modules/**"
      - "tests/**"
      - ".github/workflows/test.yml"
  push:
    branches: [main]
    paths:
      - "modules/**"
      - "tests/**"
      - ".github/workflows/test.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # A draft is skipped, matching the convention across the extension
    # repositories, so a work in progress does not spend runner minutes.
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The modules run inside Quarto's Lua and several call `pandoc.*`, so the
      # tests need the Quarto CLI rather than a standalone Lua interpreter.
      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # The suite loads and executes every module it finds on disk, which
      # subsumes a parse check, so there is no separate one.
      - name: Run the tests
        run: quarto pandoc lua tests/run.lua
