name: Test

# CITATION.cff is here so that the release bump pull request, which touches
# only CITATION.cff and CHANGELOG.md, still produces a check run. The tests do
# not read the file. The land step of release.yml waits for checks, and stops
# a release when the pull request is blocked with none, so removing this path
# would break every release the day `main` requires a status check.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "modules/**"
      - "tests/**"
      - "CITATION.cff"
      - ".github/workflows/test.yml"
  push:
    branches: [main]
    paths:
      - "modules/**"
      - "tests/**"
      - "CITATION.cff"
      - ".github/workflows/test.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # A draft is skipped, matching the convention across the extension
    # repositories, so a work in progress does not spend runner minutes.
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The modules run inside Quarto's Lua and several call `pandoc.*`, so the
      # tests need the Quarto CLI rather than a standalone Lua interpreter.
      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # q2 has no `debug` library, so the modules find their siblings another
      # way there. The suite renders a vendored copy with q2 when it is on the
      # PATH, which this step provides. HTML needs no pandoc of its own. The
      # release is pinned, so a new q2 changes the job only through a commit.
      - name: Set up q2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          q2_dir="${RUNNER_TEMP}/q2"
          mkdir -p -- "${q2_dir}/bin"
          gh release download v0.34.0 -R quarto-dev/q2 \
            -p 'q2-*-linux_amd64.tar.gz' -p 'checksums.sha256' -D "${q2_dir}"
          cd -- "${q2_dir}"
          sha256sum --check --ignore-missing --strict checksums.sha256
          tar -xzf q2-*-linux_amd64.tar.gz -C "${q2_dir}/bin"
          printf '%s\n' "${q2_dir}/bin" >> "${GITHUB_PATH}"
          "${q2_dir}/bin/q2" --version

      # The suite loads and executes every module it finds on disk, which
      # subsumes a parse check, so there is no separate one.
      - name: Run the tests
        run: quarto pandoc lua tests/run.lua
