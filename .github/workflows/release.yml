name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version bump type (patch/minor/major)"
        required: false
        default: "minor"
        type: choice
        options: [patch, minor, major]
      merge-timeout:
        description: "Seconds to wait for the version bump pull request to merge"
        required: false
        default: 1800
        type: number

# A release bumps a version, pushes a branch, and creates a tag, so two at once
# would race over all three. Queue rather than cancel: a cancelled release
# leaves the bump branch and its pull request behind.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # A push made with the default token triggers no workflow, which leaves
      # the bump pull request without the checks its auto-merge waits for.
      - name: Get the token
        id: token
        uses: mcanouil/release-actions/token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          app-key: ${{ secrets.APP_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.token.outputs.token }}

      # CITATION.cff carries the version for the whole set. A module does not
      # repeat it: the vendoring manifest records the version an extension
      # took, and a header stamped at each release changes the bytes of a
      # module whose code did not change, which breaks content addressing.
      - name: Bump the version
        id: bump
        uses: mcanouil/release-actions/bump@v1
        with:
          bump: ${{ inputs.version }}
          ecosystems: citation

      - name: Land the bump
        id: land
        uses: mcanouil/release-actions/land@v1
        with:
          mode: pull-request
          files: ${{ steps.bump.outputs.files }}
          version: ${{ steps.bump.outputs.version }}
          message: "ci: bump version for release :rocket:"
          branch: ci/bump-version
          merge-timeout: ${{ inputs.merge-timeout }}
          token: ${{ steps.token.outputs.token }}

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # A release is what a vendoring manifest points at, so it must not carry
      # a module that fails to load.
      - name: Run the tests
        run: quarto pandoc lua tests/run.lua

      - name: Build the archive
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          tar --create --gzip --file "quarto-lua-modules-${VERSION}.tar.gz" modules LICENSE README.md
          # Recorded so a manifest can pin the archive it vendored.
          sha256sum "quarto-lua-modules-${VERSION}.tar.gz" > "quarto-lua-modules-${VERSION}.tar.gz.sha256"

      - name: Compose the release body
        id: notes
        uses: mcanouil/release-actions/notes@v1
        with:
          notes-file: ${{ steps.bump.outputs.notes-file }}
          section-heading: ""

      - name: Release on GitHub
        uses: mcanouil/release-actions/release@v1
        with:
          version: ${{ steps.bump.outputs.version }}
          body-file: ${{ steps.notes.outputs.body-file }}
          title: "Quarto Lua Modules {version}"
          target: ${{ steps.land.outputs.sha }}
          assets: |
            quarto-lua-modules-${{ steps.bump.outputs.version }}.tar.gz
            quarto-lua-modules-${{ steps.bump.outputs.version }}.tar.gz.sha256
            modules/*.lua
          token: ${{ steps.token.outputs.token }}
